name: Actualizar galería desde Dropbox
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Volver a comprobar todos los archivos
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - scripts/sync_dropbox.py
      - .github/workflows/sync-dropbox.yml
permissions:
  contents: write
concurrency:
  group: dropbox-gallery
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar conversión de fotos y vídeos
        run: |
          python -m pip install 'Pillow>=11,<13' 'pillow-heif>=0.22,<2'
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Recoger nuevas fotos y vídeos
        id: import
        continue-on-error: true
        env:
          DROPBOX_SHARED_LINK: ${{ secrets.DROPBOX_SHARED_LINK }}
          FORCE_SYNC: ${{ inputs.force }}
        run: |
          if [ "$FORCE_SYNC" = 'true' ]; then
            python scripts/sync_dropbox.py --force
          else
            python scripts/sync_dropbox.py
          fi
      - name: Publicar las aportaciones importadas
        if: always()
        run: |
          git config user.name 'Galería Clara y Guillermo'
          git config user.email 'gallery@users.noreply.github.com'
          git add assets/live live-media.json media.js download-files.json .dropbox-sync/state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Añadir nuevas fotos y vídeos de Dropbox'
            git push origin HEAD:main
          fi
      - name: Señalar errores de importación
        if: steps.import.outcome == 'failure'
        run: exit 1
